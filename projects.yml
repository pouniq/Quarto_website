- title: Car Price Prediction 
  path: https://github.com/pouniq/CarPred
  image: projects/CarPred/back.jpg
  description: >
    در این پروژه اول از همه، داده های مورد نیاز ماشین کیا ریو از منبع مناسب استخراج شد، بعد از آن تحلیل اکتشافی داده ها و سپس پیش پردازش داده ها انجام شد
    برای انتخاب بهترین مدل نیز از GridSearchCv استفاده شد و بهترین مدل به وسیله Streamlit پیاده سازی شد

  categories: [Streamlit, Python, Machine Learning]


